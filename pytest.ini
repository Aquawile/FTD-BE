[pytest]
markers =
    unit: Pure unit tests with no external dependencies (no database, no HTTP server)
    db_integration: Integration tests requiring a real PostgreSQL database (uses ftd_lakehouse_test or ftd_lakehouse_api_test)
    api_contract: API contract tests requiring a running FastAPI application (TestClient or real HTTP)
    post_deploy: Post-deployment verification tests requiring fully deployed environment (version endpoint, IAP tunnel)

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning