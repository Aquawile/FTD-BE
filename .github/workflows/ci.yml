name: CI

on:
  push:
    branches: [rawdataingestion, staging, "feature/**", "hotfix/**"]
  pull_request:
    branches: [rawdataingestion, staging]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v -m unit --junitxml=unit-test-results.xml
      - name: Verify unit tests are not skipped
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('unit-test-results.xml')
          root = tree.getroot()
          total = 0
          skipped = 0
          failures = 0
          for ts in root.iter('testsuite'):
              total += int(ts.get('tests', 0))
              skipped += int(ts.get('skipped', 0))
              failures += int(ts.get('failures', 0))
          if total == 0:
              print('ERROR: No unit tests collected. Failing.')
              exit(1)
          if skipped == total:
              print(f'ERROR: All {total} unit tests were skipped. Failing.')
              exit(1)
          print(f'Unit tests: {total} total, {skipped} skipped, {failures} failures')
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: unit-test-results.xml
          retention-days: 7
      - run: python3 scripts/summarize_tests.py unit-test-results.xml "Unit Test Results"

  db-integration-tests:
    name: Database Integration Tests
    runs-on: ubuntu-latest
    # Throwaway Postgres for this job only, shaped like staging by
    # tests/schema/setup_test_db.sh. Never connects to staging; credentials
    # below exist only inside this container.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ci_postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build test database (staging schema + pending migrations + seed)
        env:
          PGUSER: postgres
          PGPASSWORD: ci_postgres
          TEST_DB: ftd_lakehouse_test
          FTD_APP_PASSWORD: ftd_app_ci
        run: bash tests/schema/setup_test_db.sh
      - name: Run db_integration tests as ftd_app (no skips allowed)
        env:
          PGDATABASE: ftd_lakehouse_test
          PGUSER: ftd_app
          PGPASSWORD: ftd_app_ci
          REQUIRE_DB: "1"
        run: python -m pytest tests/ -v -m db_integration -rxXs --junitxml=db-integration-test-results.xml
      - name: Verify db_integration tests ran
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('db-integration-test-results.xml').getroot()
          total = sum(int(ts.get('tests', 0)) for ts in root.iter('testsuite'))
          skipped = sum(int(ts.get('skipped', 0)) for ts in root.iter('testsuite'))
          xfail = sum(1 for tc in root.iter('testcase') for s in tc.findall('skipped') if (s.get('type') or '').endswith('xfail'))
          print(f'db_integration: {total} collected, {skipped - xfail} skipped, {xfail} expected failures')
          if total == 0: exit('ERROR: no db_integration tests collected')
          if skipped - xfail > 0: exit('ERROR: db_integration tests were skipped')
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-integration-test-results
          path: db-integration-test-results.xml
          retention-days: 7
      - if: always()
        run: python3 scripts/summarize_tests.py db-integration-test-results.xml "Database Integration Test Results"

  api-contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - run: |
          python -m pytest tests/ -v -m api_contract --junitxml=api-contract-test-results.xml
          if [ $? -eq 5 ]; then
            echo "No tests collected for api_contract marker, creating empty JUnit XML"
            python3 scripts/create_empty_junit.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-contract-test-results
          path: api-contract-test-results.xml
          retention-days: 7
      - run: python3 scripts/summarize_tests.py api-contract-test-results.xml "API Contract Test Results"

  # Type-checks and builds the web app once. The staging deploy ships this exact
  # build (artifact "web-dist") instead of rebuilding it.
  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: context/figma_prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: context/figma_prototype/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p .
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: context/figma_prototype/dist
          retention-days: 7

  # Real-browser tests of the whole app (e2e/): the built web app, the real API, a throwaway Postgres
  # and the Firebase Auth emulator (sign-up, verification and reset emails are read from the emulator,
  # so no real inbox or Firebase account is involved). It reports but does not gate a deploy yet:
  # it is not in ci-complete's needs, and a failure here does not fail the run.
  e2e-browser-tests:
    name: Browser Tests (Playwright)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ci_postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      E2E_FIREBASE_PROJECT: ftd-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            context/figma_prototype/package-lock.json
            e2e/package-lock.json
      - name: Build test database (staging schema + migrations + seed + browser-test seed)
        env:
          PGUSER: postgres
          PGPASSWORD: ci_postgres
          TEST_DB: ftd_lakehouse_test
          FTD_APP_PASSWORD: ftd_app_ci
        run: |
          bash tests/schema/setup_test_db.sh
          psql -v ON_ERROR_STOP=1 -X -q -d ftd_lakehouse_test -f e2e/seed/e2e_seed.sql
      - name: Build the web app pointed at the Auth emulator
        working-directory: context/figma_prototype
        env:
          VITE_FIREBASE_AUTH_EMULATOR_URL: http://127.0.0.1:9099
        run: |
          npm ci --no-audit --no-fund
          npx vite build
      - name: Install browser tests and Chromium
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit
      - name: Start Firebase Auth emulator, API and web server
        working-directory: e2e
        env:
          PGDATABASE: ftd_lakehouse_test
          PGUSER: ftd_app
          PGPASSWORD: ftd_app_ci
          FIREBASE_PROJECT_ID: ftd-2026
          FIREBASE_AUTH_ENABLED: "true"
        run: |
          npx --yes firebase-tools@13.29.1 emulators:start --only auth --project ftd-2026 > ../emulator.log 2>&1 &
          (cd .. && python -m uvicorn app.main:app --host 127.0.0.1 --port 8080 > api.log 2>&1) &
          node scripts/serve.mjs > ../web.log 2>&1 &
          for url in http://127.0.0.1:9099/ http://127.0.0.1:8080/health http://127.0.0.1:5174/; do
            for i in $(seq 1 60); do curl -fs "$url" > /dev/null && break; sleep 2; done
            curl -fs "$url" > /dev/null || { echo "not up: $url"; tail -30 ../emulator.log ../api.log ../web.log; exit 1; }
          done
      - name: Database integrity before the browser tests
        env:
          PGDATABASE: ftd_lakehouse_test
          PGUSER: ftd_app
          PGPASSWORD: ftd_app_ci
        run: python scripts/check_database_health.py
      - name: Run browser tests
        working-directory: e2e
        env:
          CI: "true"
          PGDATABASE: ftd_lakehouse_test
          PGUSER: ftd_app
          PGPASSWORD: ftd_app_ci
          E2E_REPEAT: "1"     # raise to 3 to check a new test for flakiness
        run: npx playwright test --repeat-each=${E2E_REPEAT:-1}
      - name: Database integrity after the browser tests (did the UI tests damage any data?)
        if: always()
        env:
          PGDATABASE: ftd_lakehouse_test
          PGUSER: ftd_app
          PGPASSWORD: ftd_app_ci
        run: python scripts/check_database_health.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-browser-test-results
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/e2e-test-results.xml
            emulator.log
            api.log
            web.log
          retention-days: 7
      - if: always()
        run: python3 scripts/summarize_tests.py e2e/e2e-test-results.xml "Browser Test Results (Playwright)"

  ci-complete:
    name: CI Complete
    needs: [unit-tests, db-integration-tests, api-contract-tests, frontend]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI stages passed"
      - if: always()
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          status="${{ needs.frontend.result }}"
          echo "| frontend | $([ "$status" = success ] && echo '✅ Passed' || echo "❌ $status") |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          status="${{ needs.unit-tests.result }}"
          if [ "$status" = "success" ]; then
            echo "| unit-tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$status" = "failure" ]; then
            echo "| unit-tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$status" = "skipped" ]; then
            echo "| unit-tests | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| unit-tests | ❓ Unknown |" >> $GITHUB_STEP_SUMMARY
          fi
          status="${{ needs.db-integration-tests.result }}"
          if [ "$status" = "success" ]; then
            echo "| db-integration-tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$status" = "failure" ]; then
            echo "| db-integration-tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$status" = "skipped" ]; then
            echo "| db-integration-tests | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| db-integration-tests | ❓ Unknown |" >> $GITHUB_STEP_SUMMARY
          fi
          status="${{ needs.api-contract-tests.result }}"
          if [ "$status" = "success" ]; then
            echo "| api-contract-tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$status" = "failure" ]; then
            echo "| api-contract-tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$status" = "skipped" ]; then
            echo "| api-contract-tests | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| api-contract-tests | ❓ Unknown |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All test artifacts uploaded with 7-day retention." >> $GITHUB_STEP_SUMMARY