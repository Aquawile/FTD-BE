name: CI

on:
  push:
    branches: [rawdataingestion, staging]
  pull_request:
    branches: [rawdataingestion, staging]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest tests/ -v
        continue-on-error: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "context/figma_prototype/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci --prefix context/figma_prototype

      - name: Build frontend
        run: npm run build --prefix context/figma_prototype
        continue-on-error: false

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-build
          path: context/figma_prototype/dist/
          retention-days: 7
