name: CI

on:
  push:
    branches: [rawdataingestion, staging]
  pull_request:
    branches: [rawdataingestion, staging]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint and type-check (if configured)
        run: |
          echo "Checking for lint/type-check configuration..."
          if [ -f "pyproject.toml" ] || [ -f "ruff.toml" ] || [ -f "mypy.ini" ] || [ -f ".flake8" ]; then
            echo "Lint/type-check config found — running checks..."
            # Add actual lint/type-check commands here when tooling is configured
            # Example: ruff check . && mypy app/
          else
            echo "No lint/type-check configuration found — skipping (add ruff/mypy/flake8 config to enable)"
          fi

      - name: Run unit tests (no database required)
        run: python -m pytest tests/ -v -m unit
        continue-on-error: false

  db-integration-tests:
    name: Database Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run database integration tests
        env:
          PGHOST: ${{ secrets.CI_PGHOST }}
          PGPORT: ${{ secrets.CI_PGPORT }}
          PGDATABASE: ${{ secrets.CI_PGDATABASE }}
          PGUSER: ${{ secrets.CI_PGUSER }}
          PGPASSWORD: ${{ secrets.CI_PGPASSWORD }}
        run: |
          echo "Checking for integration test database credentials..."
          if [ -z "${PGHOST}" ] || [ -z "${PGPASSWORD}" ]; then
            echo "Integration test database credentials not configured — skipping integration tests"
            exit 0
          fi
          echo "Running integration tests against ${PGHOST}:${PGPORT}/${PGDATABASE}..."
          python -m pytest tests/ -v -m db_integration
        continue-on-error: false

  api-contract-tests:
    name: API Contract Tests
    needs: db-integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run API contract tests
        run: python -m pytest tests/ -v -m api_contract
        continue-on-error: false

  ci-complete:
    name: CI Complete
    needs: [unit-tests, db-integration-tests, api-contract-tests]
    runs-on: ubuntu-latest
    steps:
      - name: CI Complete
        run: echo "All CI stages passed"