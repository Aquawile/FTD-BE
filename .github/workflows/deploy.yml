name: Deploy to GCP

on:
  push:
    branches: [rawdataingestion]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/767713105/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-deploy@ftd2026.iam.gserviceaccount.com'
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ftd2026
          install_components: beta
      
      - name: Deploy GNews Cloud Function
        if: |
          github.event_name == 'workflow_dispatch' ||
          contains(github.event.head_commit.message, 'gnews') ||
          contains(github.event.head_commit.message, 'deploy')
        run: |
          gcloud functions deploy gnews-ingest \
            --project=ftd2026 \
            --region=us-west2 \
            --runtime=python311 \
            --trigger-http \
            --allow-unauthenticated \
            --entry-point=gnews_ingest \
            --source=gnews \
            --timeout=300s \
            --memory=512MB \
            --min-instances=0 \
            --max-instances=1 \
            --service-account=gnews-ingestion-sa@ftd2026.iam.gserviceaccount.com \
            --set-secrets=GNEWS_API_KEY_SECRET=gnews-api-key:latest \
            --set-env-vars="GCS_BUCKET=raw-data-strg,GCS_PREFIX=gnews,TICKERS_GCS_PATH=SEC/config/fortune500.json" \
            --no-gen2 \
            --quiet
          echo "GNews Cloud Function deployed"
      
      - name: Deploy Prices VM Script
        if: |
          github.event_name == 'workflow_dispatch' ||
          contains(github.event.head_commit.message, 'prices') ||
          contains(github.event.head_commit.message, 'deploy')
        run: |
          gcloud compute instances start data-ingest-vm --zone=us-west2-a --project=ftd2026 --quiet
          sleep 15
          gcloud compute ssh data-ingest-vm --zone=us-west2-a --project=ftd2026 --command="rm -rf ~/prices-ingestion" --quiet
          gcloud compute ssh data-ingest-vm --zone=us-west2-a --project=ftd2026 --command="mkdir -p ~/prices" --quiet
          gcloud compute scp prices/main.py data-ingest-vm:~/prices/main.py --zone=us-west2-a --project=ftd2026 --quiet
          gcloud compute scp prices/run.sh data-ingest-vm:~/prices/run.sh --zone=us-west2-a --project=ftd2026 --quiet
          gcloud compute scp prices/requirements.txt data-ingest-vm:~/prices/requirements.txt --zone=us-west2-a --project=ftd2026 --quiet
          gcloud compute ssh data-ingest-vm --zone=us-west2-a --project=ftd2026 --command="pip3 install --break-system-packages -r ~/prices/requirements.txt && chmod +x ~/prices/run.sh && (crontab -l 2>/dev/null | grep -v 'prices/run.sh'; echo '0 22 * * * /home/isabellabutera/prices/run.sh') | crontab -" --quiet
          gcloud compute instances stop data-ingest-vm --zone=us-west2-a --project=ftd2026 --quiet
          echo "Prices VM script, dependencies, and cron updated. VM stopped."
