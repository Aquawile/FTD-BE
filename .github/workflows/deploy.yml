        run: |
          COMMIT_SHA=${{ github.sha }}
          echo "Waiting for CI to complete for commit $COMMIT_SHA..."
          CI_FOUND=false
          for i in $(seq 1 18); do
            CI_STATUS=$(gh run list --workflow="CI" --commit="$COMMIT_SHA" --limit=1 --json=conclusion --jq='.[0].conclusion' 2>/dev/null || echo "")
            if [ -z "$CI_STATUS" ]; then
              echo "CI not started yet, waiting 10s (attempt $i/18)..."
              sleep 10
              continue
            fi
            CI_FOUND=true
            if [ "$CI_STATUS" == "success" ]; then
              echo "CI passed after $i attempt(s)"
              break
            elif [ "$CI_STATUS" == "failure" ]; then
              echo "ERROR: CI failed for commit $COMMIT_SHA"
              exit 1
            else
              echo "CI status: $CI_STATUS, waiting 10s (attempt $i/18)..."
              sleep 10
            fi
          done
          if [ "$CI_FOUND" != "true" ]; then
            echo "ERROR: CI workflow not found for commit $COMMIT_SHA after 3 minutes"
            exit 1
          fi
      
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/767713105/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-deploy@ftd2026.iam.gserviceaccount.com'
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ftd2026
          install_components: beta
      
      - name: Deploy Application to ftd-staging (Staging)
        run: |
          echo "Starting application deployment to ftd-staging (staging)..."
          
          gcloud compute instances start ftd-staging --zone=us-west2-a --project=ftd2026 --quiet

          READY=false
          for i in $(seq 1 18); do
            if gcloud compute ssh isabellabutera@ftd-staging --zone=us-west2-a --project=ftd2026 --tunnel-through-iap --command="echo 'ftd-staging SSH ready'" --quiet; then
              echo "SSH ready after $i attempt(s)"
              READY=true
              break
            fi
            echo "SSH not ready yet, waiting 10s (attempt $i/18)..."
            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "ERROR: ftd-staging did not become SSH-ready within 3 minutes"
            exit 1
          fi
          
          echo "Stopping existing FastAPI process..."
          gcloud compute ssh isabellabutera@ftd-staging --zone=us-west2-a --project=ftd2026 --tunnel-through-iap --command="pkill -x uvicorn || true" --quiet
          
          echo "Cleaning stale application files..."
          gcloud compute ssh isabellabutera@ftd-staging --zone=us-west2-a --project=ftd2026 --tunnel-through-iap --command="cd /home/isabellabutera/app && rm -rf main.py models.py router.py users.py services tests ._app .pytest_cache" --quiet
          
          echo "Deploying startup script..."
          gcloud compute scp --tunnel-through-iap scripts/start_app.sh isabellabutera@ftd-staging:/home/isabellabutera/start_app.sh --zone=us-west2-a --project=ftd2026 --quiet
          gcloud compute ssh isabellabutera@ftd-staging --zone=us-west2-a --project=ftd2026 --tunnel-through-iap --command="chmod +x /home/isabellabutera/start_app.sh" --quiet
          
          echo "Verifying VM deployment prerequisites..."
          gcloud compute ssh isabellabutera@ftd-staging --zone=us-west2-a --project=ftd2026 --tunnel-through-iap --command="test -f /home/isabellabutera/start_app.sh && test -x /home/isabellabutera/start_app.sh || { echo 'ERROR: /home/isabellabutera/start_app.sh is missing or not executable'; exit 1; }" --quiet
          
          echo "Syncing backend code..."
          gcloud compute ssh isabellabutera@ftd-staging --zone=us-west2-a --project=ftd2026 --tunnel-through-iap --command="rm -rf /home/isabellabutera/app/app && mkdir -p /home/isabellabutera/app/app" --quiet
          gcloud compute scp --tunnel-through-iap --recurse app/ isabellabutera@ftd-staging:/home/isabellabutera/app/app/ --zone=us-west2-a --project=ftd2026 --quiet
          gcloud compute scp --tunnel-through-iap requirements.txt isabellabutera@ftd-staging:/home/isabellabutera/requirements.txt --zone=us-west2-a --project=ftd2026 --quiet
          gcloud compute ssh isabellabutera@ftd-staging --zone=us-west2-a --project=ftd2026 --tunnel-through-iap --command="find /home/isabellabutera/app/app -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true" --quiet
          
          echo "Ensuring Python virtual environment exists..."
