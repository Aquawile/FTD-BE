          echo "Installing Python dependencies..."
          gcloud compute ssh isabellabutera@ftd-staging --zone=us-west2-a --project=ftd2026 --tunnel-through-iap --command="cd /home/isabellabutera/app && .venv/bin/pip install --break-system-packages -r /home/isabellabutera/requirements.txt" --quiet
          
          echo "Building React frontend..."
          npm ci --prefix context/figma_prototype
          npm run build --prefix context/figma_prototype
          
          echo "Deploying React build..."
          gcloud compute ssh isabellabutera@ftd-staging --zone=us-west2-a --project=ftd2026 --tunnel-through-iap --command="mkdir -p /home/isabellabutera/frontend/dist" --quiet
          gcloud compute scp --tunnel-through-iap --recurse context/figma_prototype/dist/ isabellabutera@ftd-staging:/home/isabellabutera/frontend/dist/ --zone=us-west2-a --project=ftd2026 --quiet
          
          echo "Writing version metadata..."
          cat > /tmp/version.json << EOF
          {
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "commit_message": "$(git log -1 --format=%s)",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "environment": "staging",
            "workflow_run_id": "${{ github.run_id }}"
          }
          EOF
          gcloud compute scp --tunnel-through-iap /tmp/version.json isabellabutera@ftd-staging:/home/isabellabutera/version.json --zone=us-west2-a --project=ftd2026 --quiet
          
          echo "Starting FastAPI..."
          gcloud compute ssh isabellabutera@ftd-staging --zone=us-west2-a --project=ftd2026 --tunnel-through-iap --command="PGPASSWORD='${{ secrets.FTD_STAGING_PG_PASSWORD }}' bash /home/isabellabutera/start_app.sh" --quiet
          
          echo "Waiting for FastAPI to become healthy..."
          HEALTHY=false
          for i in $(seq 1 24); do
            RESPONSE=$(gcloud compute ssh isabellabutera@ftd-staging --zone=us-west2-a --project=ftd2026 --tunnel-through-iap --command="curl -s http://127.0.0.1:8000/health || echo 'CURL_FAILED'" --quiet)
            if echo "$RESPONSE" | grep -q '"status":"ok"'; then
              echo "FastAPI healthy after $i attempt(s)"
              HEALTHY=true
              break
            fi
            echo "Health check attempt $i failed. Response: $RESPONSE"
            echo "Health check not ready yet, waiting 5s..."
